name: CI
on: push

permissions: {}

env:
  CARGO_TERM_COLOR: always
  NIX_DEV: nix develop --no-update-lock-file .#ci --command

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      # Required for checkout while this repo is private
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We will not perform any other git operations in this repo
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Print Cargo version/Load environment
        run: ${{ env.NIX_DEV }} cargo --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cmd-format: ${{ env.NIX_DEV }} {0}


      - name: Format
        run: ${{ env.NIX_DEV }} cargo fmt --check

      - name: Lint
        run: ${{ env.NIX_DEV }} cargo clippy --locked -- --warn clippy::pedantic

      - name: Run tests
        run: ${{ env.NIX_DEV }} cargo test --locked
