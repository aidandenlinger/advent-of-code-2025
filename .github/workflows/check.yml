name: CI
on: push

permissions: {}

env:
  CARGO_TERM_COLOR: always
  NIX_DEV: nix develop --no-update-lock-file .#ci --command

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      # Required for checkout while this repo is private
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # We will not perform any other git operations in this repo
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cmd-format: ${{ env.NIX_DEV }} {0}


      - name: Format
        run: ${{ env.NIX_DEV }} cargo fmt --check

      - name: Lint
        run: ${{ env.NIX_DEV }} cargo clippy --locked -- --warn clippy::pedantic

      - name: Run tests
        run: ${{ env.NIX_DEV }} cargo test --locked
