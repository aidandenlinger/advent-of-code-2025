[package]
name = "advent-of-code-2025"
description = "Runner for Advent of Code 2025 problems"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
color-eyre = "0.6.5"
env_logger = "0.11.9"
log = "0.4.29"
test-case = "3.3.1"
winnow = "1.0.3"

# Recommended by color-eyre - https://docs.rs/color-eyre/latest/color_eyre/#improving-perf-on-debug-builds
[profile.dev.package.backtrace]
opt-level = 3
